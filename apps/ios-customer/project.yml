# ================================================================
# 问玄东方 C端 iOS App - XcodeGen 工程配置
# 生成方式：在 apps/ios-customer 目录下执行 `xcodegen generate`
# ================================================================

name: DongFangApp
options:
  bundleIdPrefix: com.dongfang
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_PREVIEWS: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: DongFangApp/Resources/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.dongfang.customer
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "20260818"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    DEVELOPMENT_TEAM: ""

configs:
  Debug: debug
  Release: release

targets:
  DongFangApp:
    type: application
    platform: iOS
    sources:
      - path: ../../packages/service-journey-native
      - path: ../../packages/chat-native
      - path: ../../packages/design-tokens/fonts
        includes: ["AskXuanSerif-Semibold.ttf", "OFL.txt"]
        buildPhase: resources
      - path: DongFangApp
        excludes:
          - "Resources/Info.plist"
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: DongFangApp/Resources/DongFangApp.entitlements
        ASKXUAN_API_BASE_URL: "https://101.96.228.71/api/v1"
        OPENIM_API_URL: "https://101.96.228.71/openim-api"
        OPENIM_WS_URL: "wss://101.96.228.71/openim-ws"
        DEVELOPMENT_TEAM: DQ3YY8MTFW
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        APS_ENVIRONMENT: production
        INFOPLIST_FILE: DongFangApp/Resources/Info.plist
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: DongFangApp/Resources/Debug.entitlements
          APS_ENVIRONMENT: development
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          OTHER_SWIFT_FLAGS: "-DDEBUG"
    info:
      path: DongFangApp/Resources/Info.plist
      properties:
        ASKXUAN_API_BASE_URL: $(ASKXUAN_API_BASE_URL)
        OPENIM_API_URL: $(OPENIM_API_URL)
        OPENIM_WS_URL: $(OPENIM_WS_URL)
        NSMicrophoneUsageDescription: 用于录制咨询语音和语音通话
        NSCameraUsageDescription: 用于视频咨询通话
        UIAppFonts: ["AskXuanSerif-Semibold.ttf"]
        CFBundleDisplayName: 问玄东方
        CFBundleShortVersionString: "0.0.1"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleDefault
        UIViewControllerBasedStatusBarAppearance: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true

  DongFangAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DongFangAppTests
    dependencies:
      - target: DongFangApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dongfang.customer.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DongFangApp.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/DongFangApp"
        BUNDLE_LOADER: "$(TEST_HOST)"

  DongFangAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DongFangAppUITests
    dependencies:
      - target: DongFangApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dongfang.customer.uitests
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ""
        TEST_TARGET_NAME: DongFangApp

schemes:
  DongFangApp:
    build:
      targets:
        DongFangApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DongFangAppTests
        - DongFangAppUITests
