# ================================================================
# 问玄东方 P03 法师工作台 iOS App - XcodeGen 工程配置
# 生成方式：在 apps/ios-master 目录下执行 `xcodegen generate`
# ================================================================

name: MasterApp
options:
  bundleIdPrefix: com.askxuan
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_PREVIEWS: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: MasterApp/Resources/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.askxuan.master
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    DEVELOPMENT_TEAM: ""

configs:
  Debug: debug
  Release: release

targets:
  MasterApp:
    type: application
    platform: iOS
    sources:
      - path: ../../packages/service-journey-native
      - path: ../../packages/chat-native
      - path: ../../packages/design-tokens/fonts
        includes: ["AskXuanSerif-Semibold.ttf", "OFL.txt"]
        buildPhase: resources
      - path: MasterApp
        excludes:
          - "Resources/Info.plist"
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: MasterApp/Resources/MasterApp.entitlements
        ASKXUAN_API_BASE_URL: "https://101.96.228.71/api/v1"
        OPENIM_API_URL: "https://101.96.228.71/openim-api"
        OPENIM_WS_URL: "wss://101.96.228.71/openim-ws"
        DEVELOPMENT_TEAM: DQ3YY8MTFW
        APS_ENVIRONMENT: production
        INFOPLIST_FILE: MasterApp/Resources/Info.plist
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: MasterApp/Resources/Debug.entitlements
          APS_ENVIRONMENT: development
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          OTHER_SWIFT_FLAGS: "-DDEBUG"
    info:
      path: MasterApp/Resources/Info.plist
      properties:
        ASKXUAN_API_BASE_URL: $(ASKXUAN_API_BASE_URL)
        OPENIM_API_URL: $(OPENIM_API_URL)
        OPENIM_WS_URL: $(OPENIM_WS_URL)
        NSMicrophoneUsageDescription: 用于录制咨询语音和语音通话
        NSCameraUsageDescription: 用于视频咨询通话
        UIAppFonts: ["AskXuanSerif-Semibold.ttf"]
        CFBundleDisplayName: 问玄法师端
        CFBundleShortVersionString: "0.0.1"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleDefault
        UIViewControllerBasedStatusBarAppearance: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
