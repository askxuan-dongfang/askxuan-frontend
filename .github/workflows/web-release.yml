name: Web CI and ECS release
on:
  push:
    branches: [master]
    paths: ['apps/web-platform-admin/**', 'apps/web-shop-admin/**', 'apps/web-temple-admin/**', 'packages/**', 'scripts/**', 'e2e/**', '.github/**']
  pull_request:
    branches: [master]
    paths: ['apps/web-platform-admin/**', 'apps/web-shop-admin/**', 'apps/web-temple-admin/**', 'packages/**', 'scripts/**', 'e2e/**', '.github/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: askxuan-dongfang/askxuan-backend
          ref: 45084a174d0eab883b991c27c2180468ccacbb19
          path: .ci-tools
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 'apps/web-*/package-lock.json'
      - name: Check admin apps on pull requests
        if: github.event_name == 'pull_request'
        run: |
          for app in web-platform-admin web-shop-admin web-temple-admin; do
            (cd "apps/$app" && npm ci && npm run build)
          done
      - name: Build admin web components with exact source provenance
        if: github.event_name != 'pull_request'
        run: python3 .ci-tools/scripts/ci/release.py web --frontend .
      - name: Run admin media review regressions
        if: github.event_name != 'pull_request'
        working-directory: e2e
        env:
          CI_ADMIN_ONLY: '1'
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test --config playwright.community.config.ts --grep 'admin reviews'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name != 'pull_request'
        with:
          name: ecs-release
          path: release.tgz
          retention-days: 3
          if-no-files-found: error
  deploy:
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && vars.ECS_DEPLOY_ENABLED == 'true'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: askxuan-dongfang/askxuan-backend
          ref: 45084a174d0eab883b991c27c2180468ccacbb19
          path: .ci-tools
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ecs-release
      - name: Publish web components through restricted SSH receiver
        env:
          ECS_HOST: ${{ vars.ECS_HOST }}
          ECS_DEPLOY_KEY: ${{ secrets.ECS_DEPLOY_KEY }}
          ECS_KNOWN_HOSTS: ${{ secrets.ECS_KNOWN_HOSTS }}
        run: bash .ci-tools/scripts/ci/publish.sh release.tgz
